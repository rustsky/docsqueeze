[package]
name = "docsqueeze"
version = "0.1.1"
edition = "2024"
autobins = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hayro = { version = "0.8.0", features = ["embed-fonts"] }
hayro-jpeg2000 = "0.4.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
lopdf = "0.46.0"
# Already a hayro dependency; SIMD resizing, much faster than image::imageops.
pic-scale = { version = "0.7.12", default-features = false }
rayon = "1.12.0"
# No devtools (hot reload) or logger: neither is used in release builds.
dioxus = { version = "0.7.10", default-features = false, features = ["desktop", "launch", "lib"], optional = true }
futures-channel = { version = "0.3.34", optional = true }
futures-util = { version = "0.3.34", optional = true }
rfd = { version = "0.17.2", optional = true }

[features]
gui = ["dep:dioxus", "dep:futures-channel", "dep:futures-util", "dep:rfd"]

[[bin]]
name = "docsqueeze_cli"
path = "src/main.rs"

[[bin]]
name = "Docsqueeze"
path = "src/bin/docsqueeze-gui.rs"
required-features = ["gui"]

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# Optimize for size overall; hot paths below stay at full speed.
opt-level = "z"

[profile.release.package]
pic-scale.opt-level = 3
image.opt-level = 3
zune-jpeg.opt-level = 3
hayro.opt-level = 3
hayro-interpret.opt-level = 3
vello_cpu.opt-level = 3
vello_common.opt-level = 3
fearless_simd.opt-level = 3
zlib-rs.opt-level = 3

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
