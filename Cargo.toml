[package]
name = "docsqueeze"
version = "0.1.0"
edition = "2024"
autobins = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
hayro = { version = "0.8.0", features = ["embed-fonts"] }
hayro-jpeg2000 = "0.4.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
lopdf = "0.46.0"
rayon = "1.12.0"
dioxus = { version = "0.7.10", features = ["desktop"], optional = true }
futures-channel = { version = "0.3.34", optional = true }
futures-util = { version = "0.3.34", optional = true }
rfd = { version = "0.17.2", optional = true }

[features]
gui = ["dep:dioxus", "dep:futures-channel", "dep:futures-util", "dep:rfd"]

[[bin]]
name = "docsqueeze_cli"
path = "src/main.rs"

[[bin]]
name = "Docsqueeze"
path = "src/bin/docsqueeze-gui.rs"
required-features = ["gui"]

[dev-dependencies]
tempfile = "3.27.0"
