name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Must match the dioxus version in Cargo.toml.
  DX_VERSION: 0.7.10

jobs:
  linux:
    name: Linux (AppImage)
    # Oldest supported runner, so the AppImage runs on older glibc versions.
    runs-on: ubuntu-22.04
    env:
      # linuxdeploy is itself an AppImage; runners have no FUSE.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev \
            libayatana-appindicator3-dev librsvg2-dev file
      # Prebuilt dx needs a newer glibc than this runner has, so build it here.
      # rust-cache keeps ~/.cargo/bin, and cargo install skips an installed version.
      - run: cargo install --locked dioxus-cli@${{ env.DX_VERSION }}
      - name: Build
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          cargo build --release --locked --bin docsqueeze_cli
          dx bundle --linux --release --locked --bin Docsqueeze --features gui \
            --package-types appimage --out-dir dist/bundle
          mv dist/bundle/*.AppImage "dist/docsqueeze-$version-linux-x86_64.AppImage"
          tar -C target/release -czf "dist/docsqueeze-cli-$version-linux-x86_64.tar.gz" docsqueeze_cli
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.tar.gz

  macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: scripts/bundle-macos.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.dmg
            dist/*.tar.gz

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --force dioxus-cli@${{ env.DX_VERSION }}
      - name: Build
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          cargo build --release --locked --features gui --bins
          dx bundle --windows --release --locked --bin Docsqueeze --features gui \
            --package-types nsis --out-dir dist/bundle
          mv dist/bundle/*.exe "dist/docsqueeze-$version-windows-x64-setup.exe"
          7z a "dist/docsqueeze-$version-windows-x64-portable.zip" \
            ./target/release/docsqueeze_cli.exe ./target/release/Docsqueeze.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
